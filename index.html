<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gaming Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            margin: 0;
        }

        header {
            background: #222;
            padding: 25px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .card {
            background: #222;
            margin: 25px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 MY GAMING HUB</h1>
        <p>Welcome to my gaming website!</p>
    </header>

    <div class="card">
        <h2>🏆 Gaming Leaderboard</h2>

        <p>🥇 Player One — 1500 points</p>
        <p>🥈 Player Two — 1200 points</p>
        <p>🥉 Player Three — 900 points</p>

        <button onclick="showMessage()">Join the Game</button>
    </div>

    <script>
        function showMessage() {
            alert("Welcome to the Gaming Hub! 🎮");
        }
    </script>

</body>
</html>
